name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv pip install --python /usr/bin/python3 -e ".[dev]"
      - name: Run ruff (lint)
        run: uv run ruff check src/ tests/
      - name: Run ruff (format check)
        run: uv run ruff format --check src/ tests/
      - name: Run mypy (type check)
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: python3 -m venv .venv
      - name: Install dependencies
        run: uv pip install --python .venv -e ".[dev]"
      - name: Run tests with coverage
        run: |
          uv run --python .venv pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=95
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: python3 -m venv .venv
      - name: Install dependencies
        run: uv pip install --python .venv -e ".[dev]"
      - name: pip-audit (vulnerability scan)
        run: uv run --python .venv pip-audit
      - name: bandit (security lint)
        run: uv run --python .venv bandit -r src/ -ll

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Verify package
        run: uv pip install --python /usr/bin/python3 dist/*.whl

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
