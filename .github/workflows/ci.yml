name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff (lint)
        run: ruff check src/ tests/
      - name: Run ruff (format check)
        run: ruff format --check src/ tests/
      - name: Run mypy (type check)
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Debug environment
        run: |
          python --version
          pip list 2>/dev/null | grep -i -E "pytest|coverage|langsmith" || true
      - name: Run tests
        run: |
          pytest tests/ --tb=long -q 2>&1 || true
      - name: Run coverage report
        if: success()
        run: |
          coverage run -m pytest tests/ -q --tb=short 2>&1
          coverage xml
          coverage report --fail-under=95
      - name: Upload test logs on failure
        if: failure()
        run: |
          echo "=== pytest output ==="
          cat ~/.pytest_cache/*/test_results.txt 2>/dev/null || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  security:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (vulnerability scan)
        run: pip-audit
      - name: bandit (security lint)
        run: bandit -r src/ -ll

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: python -m build
      - name: Verify package
        run: pip install --force-reinstall dist/*.whl

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}